<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        padding: 12px;
        color: #202124;
        background-color: #f8f9fa;
      }
      .tab-header {
        display: flex;
        border-bottom: 2px solid #dadce0;
        margin-bottom: 12px;
      }
      .tab-btn {
        flex: 1;
        padding: 8px 4px;
        background: none;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 11px;
        color: #5f6368;
        text-transform: uppercase;
      }
      .tab-btn.active {
        color: #1a73e8;
        border-bottom: 2px solid #1a73e8;
      }
      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
      }
      .sheet-list {
        max-height: 150px;
        overflow-y: auto;
        border: 1px solid #dadce0;
        background: #fff;
        padding: 6px;
        border-radius: 4px;
        margin-bottom: 10px;
      }
      .sheet-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0;
        font-size: 13px;
      }
      .sheet-item label {
        cursor: pointer;
        flex: 1;
        margin-left: 6px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .btn-group {
        display: flex;
        gap: 6px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }
      button {
        background-color: #1a73e8;
        color: white;
        border: none;
        padding: 8px 12px;
        font-size: 12px;
        font-weight: 600;
        border-radius: 4px;
        cursor: pointer;
        width: 100%;
      }
      button:hover { background-color: #1557b0; }
      button.secondary { background-color: #5f6368; }
      button.danger { background-color: #d93025; }
      button.success { background-color: #1e8e3e; }
      button.success:hover { background-color: #137333; }

      input[type="text"], input[type="password"] {
        width: 100%;
        padding: 7px;
        box-sizing: border-box;
        margin-bottom: 8px;
        border: 1px solid #dadce0;
        border-radius: 4px;
      }
      .badge {
        font-size: 10px;
        padding: 2px 4px;
        background: #e8eaed;
        border-radius: 3px;
      }
      .badge.lock { background: #fce8e6; color: #c5221f; }
      .badge-owner {
        display: inline-block;
        font-size: 10px;
        background: #e8f0fe;
        color: #1a73e8;
        padding: 2px 6px;
        border-radius: 4px;
        margin-bottom: 8px;
        font-weight: bold;
      }
      .feedback {
        font-size: 12px;
        margin-top: 8px;
        padding: 8px;
        border-radius: 4px;
        display: none;
      }
      .feedback.error { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
      .feedback.success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
      .section-card {
        background: #ffffff;
        border: 1px solid #dadce0;
        border-radius: 6px;
        padding: 10px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>

    <!-- Tab Header Navigation -->
    <div class="tab-header">
      <button class="tab-btn active" onclick="switchTab('managerTab')">Manager</button>
      <button class="tab-btn" onclick="switchTab('combinerTab')">Combiner</button>
      <button class="tab-btn" onclick="switchTab('accessTab')">Access Control</button>
    </div>

    <!-- MODULE 1: SHEET MANAGER -->
    <div id="managerTab" class="tab-content active">
      <input type="text" id="searchSheet" placeholder="Search sheets..." onkeyup="filterSheets()">
      <div class="sheet-list" id="managerSheetList">Loading...</div>
      
      <div class="btn-group">
        <button onclick="applyBulkAction('hide')" class="secondary" style="flex:1;">Hide</button>
        <button onclick="applyBulkAction('unhide')" class="secondary" style="flex:1;">Unhide</button>
        <button onclick="applyBulkAction('delete')" class="danger" style="flex:1;">Delete</button>
      </div>
      <button onclick="duplicateSelected()" class="secondary">Duplicate Selected Sheet</button>
    </div>

    <!-- MODULE 2: SHEET COMBINER -->
    <div id="combinerTab" class="tab-content">
      <label style="font-size: 12px; font-weight: bold;">Select Sheets to Combine:</label>
      <div class="sheet-list" id="combinerSheetList">Loading...</div>
      
      <input type="text" id="masterSheetName" placeholder="Master Sheet Name" value="Master Sheet">
      <label style="font-size: 12px; display: block; margin-bottom: 8px;">
        <input type="checkbox" id="addSourceCol" checked> Include Source Sheet Column
      </label>
      <button onclick="runCombiner()">Combine Sheets</button>
    </div>

    <!-- MODULE 3: ACCESS CONTROL -->
    <div id="accessTab" class="tab-content">
      
      <!-- Protect Sheet Section (OWNER ONLY) -->
      <div id="ownerSection" class="section-card" style="display: none;">
        <span class="badge-owner">OWNER ONLY</span>
        <label style="font-size: 12px; font-weight: bold; display: block; margin-bottom:4px;">Protect Sheet with Passcode:</label>
        
        <div>
          <label style="font-size: 12px;"><input type="checkbox" id="selectAllAcc" onchange="toggleSelectAllAcc(this)"> Select All</label>
        </div>
        
        <div class="sheet-list" id="accessSheetList">Loading...</div>
        <button onclick="handleLockSheets()">Lock & Generate Passcode</button>
        <div id="ownerFeedback" class="feedback"></div>
      </div>

      <!-- Unlock Protected Sheet Section (VISIBLE TO ALL USERS) -->
      <div class="section-card">
        <label style="font-size: 12px; font-weight: bold; display:block; margin-bottom: 4px;">Unlock Protected Sheet:</label>
        <input type="text" id="unlockPasscode" placeholder="Enter 5-Digit Passcode" maxlength="5">
        <button onclick="handleUnlockSheet()" class="success">Unlock Active Sheet</button>
        <div id="unlockFeedback" class="feedback"></div>
      </div>

    </div>

    <script>
      window.onload = function() {
        checkOwnerStatus();
        loadSheets();
      };

      function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
        loadSheets();
      }

      function checkOwnerStatus() {
        google.script.run
          .withSuccessHandler(isOwner => {
            if (isOwner) document.getElementById('ownerSection').style.display = 'block';
          })
          .isSheetOwner();
      }

      function loadSheets() {
        google.script.run.withSuccessHandler(renderSheets).getSheetsInfo();
      }

      function renderSheets(sheets) {
        // Manager List
        const mgrList = document.getElementById('managerSheetList');
        mgrList.innerHTML = sheets.map(s => `
          <div class="sheet-item" data-name="${s.name.toLowerCase()}">
            <div>
              <input type="checkbox" class="mgr-check" value="${s.name}">
              <label onclick="activateSheet('${s.name}')">${s.name}</label>
            </div>
            <span>
              ${s.isHidden ? '<span class="badge">Hidden</span>' : ''}
              ${s.isProtected ? '<span class="badge lock">Locked</span>' : ''}
            </span>
          </div>
        `).join('');

        // Combiner List
        const combList = document.getElementById('combinerSheetList');
        combList.innerHTML = sheets.map(s => `
          <div class="sheet-item">
            <div>
              <input type="checkbox" class="comb-check" value="${s.name}">
              <label>${s.name}</label>
            </div>
          </div>
        `).join('');

        // Access Control List
        const accList = document.getElementById('accessSheetList');
        accList.innerHTML = sheets.map(s => `
          <div class="sheet-item">
            <div>
              <input type="checkbox" class="acc-check" value="${s.name}">
              <label>${s.name}</label>
            </div>
          </div>
        `).join('');
      }

      function filterSheets() {
        const query = document.getElementById('searchSheet').value.toLowerCase();
        document.querySelectorAll('#managerSheetList .sheet-item').forEach(el => {
          const name = el.getAttribute('data-name');
          el.style.display = name.includes(query) ? 'flex' : 'none';
        });
      }

      function toggleSelectAllAcc(master) {
        document.querySelectorAll('.acc-check').forEach(cb => cb.checked = master.checked);
      }

      function activateSheet(name) {
        google.script.run.withSuccessHandler(loadSheets).activateSheet(name);
      }

      function getSelectedValues(className) {
        return Array.from(document.querySelectorAll(`.${className}:checked`)).map(cb => cb.value);
      }

      function applyBulkAction(action) {
        const selected = getSelectedValues('mgr-check');
        if (selected.length === 0) return alert('Select at least one sheet.');

        if (action === 'delete' && !confirm('Delete selected sheets?')) return;

        const handler = google.script.run.withSuccessHandler(loadSheets);
        if (action === 'hide') handler.bulkHideSheets(selected);
        if (action === 'unhide') handler.bulkUnhideSheets(selected);
        if (action === 'delete') handler.bulkDeleteSheets(selected);
      }

      function duplicateSelected() {
        const selected = getSelectedValues('mgr-check');
        if (selected.length === 0) return alert('Select a sheet to duplicate.');
        google.script.run.withSuccessHandler(loadSheets).duplicateSheet(selected[0]);
      }

      function runCombiner() {
        const selected = getSelectedValues('comb-check');
        const masterName = document.getElementById('masterSheetName').value;
        const addSource = document.getElementById('addSourceCol').checked;

        if (selected.length === 0) return alert('Select sheets to combine.');

        google.script.run.withSuccessHandler(msg => {
          alert(msg);
          loadSheets();
        }).combineSheets(selected, masterName, addSource);
      }

      function handleLockSheets() {
        const selected = getSelectedValues('acc-check');
        const feedback = document.getElementById('ownerFeedback');
        
        if (selected.length === 0) {
          showFeedback(feedback, 'Please select at least one sheet to lock.', false);
          return;
        }

        showFeedback(feedback, 'Locking sheets and generating 5-digit passcodes...', true);

        google.script.run
          .withSuccessHandler(res => {
            showFeedback(feedback, `Locked ${res.generated.length} sheet(s). Passcodes stored in 'passcodes' sheet.`, true);
            loadSheets();
          })
          .withFailureHandler(err => {
            showFeedback(feedback, err.message, false);
          })
          .lockSelectedSheets(selected);
      }

      function handleUnlockSheet() {
        const passcode = document.getElementById('unlockPasscode').value;
        const feedback = document.getElementById('unlockFeedback');

        if (!passcode || passcode.length !== 5) {
          showFeedback(feedback, 'Please enter a valid 5-digit passcode.', false);
          return;
        }

        google.script.run
          .withSuccessHandler(activeSheetName => {
            // ROUTE THROUGH THE WEB APP PROXY BRIDGE
            google.script.run
              .withSuccessHandler(res => {
                showFeedback(feedback, res.message, res.success);
                if (res.success) {
                  document.getElementById('unlockPasscode').value = '';
                  loadSheets();
                }
              })
              .proxyUnlockSheet(activeSheetName, passcode);
          })
          .getActiveSheetName();
      }

      function showFeedback(el, msg, isSuccess) {
        el.style.display = 'block';
        el.className = `feedback ${isSuccess ? 'success' : 'error'}`;
        el.innerText = msg;
      }
    </script>
  </body>
</html>

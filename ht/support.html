<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support - Googlemarks</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo-container">
        <img src="logo.png" alt="Googlemarks Logo">
      </a>
      <nav>
        <a href="index.html">Home</a>
        <a href="post-install.html">Getting Started</a>
        <a href="support.html" class="active">Support</a>
        <a href="terms.html">Terms</a>
        <a href="privacy.html">Privacy</a>
      </nav>
    </div>
  </header>

  <main class="main-container">
    <h1>Googlemarks Support</h1>
    <p>Submit your inquiry below. A copy of this ticket will automatically be sent to your email address as confirmation.</p>

    <form id="supportForm" action="https://formspree.io/f/mwlpeqjl" method="POST">
      <!-- Formspree setting to CC the submitting user -->
      <input type="hidden" name="_cc" id="ccEmail">

      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="Full Name">
      </div>

      <div class="form-group">
        <label for="email">Your Email Address</label>
        <input type="email" id="email" name="email" required placeholder="name@example.com">
      </div>

      <div class="form-group">
        <label for="subject">Subject</label>
        <input type="text" id="subject" name="subject" required placeholder="Issue with Passcode Protection">
      </div>

      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="Describe your issue or feature request..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Submit Ticket</button>
    </form>

    <div id="formStatus"></div>
  </main>

  <script>
    const form = document.getElementById("supportForm");
    const emailInput = document.getElementById("email");
    const ccEmail = document.getElementById("ccEmail");
    const status = document.getElementById("formStatus");
    const btn = document.getElementById("submitBtn");

    emailInput.addEventListener("input", () => {
      ccEmail.value = emailInput.value;
    });

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      btn.disabled = true;
      btn.innerText = "Sending...";
      status.style.display = "none";

      try {
        const response = await fetch(form.action, {
          method: form.method,
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });

        if (response.ok) {
          status.className = "status-success";
          status.innerText = "Thank you! Your support ticket was sent. A copy has been delivered to your email.";
          status.style.display = "block";
          form.reset();
        } else {
          throw new Error();
        }
      } catch (err) {
        status.className = "status-error";
        status.innerText = "Failed to send ticket. Please try again or check your connection.";
        status.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerText = "Submit Ticket";
      }
    });
  </script>

  <footer>
    &copy; 2026 Googlemarks. All rights reserved.
  </footer>
</body>
</html>
